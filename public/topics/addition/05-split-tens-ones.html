<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แยกสิบ แยกหน่วย</title>
  <link href="https://fonts.googleapis.com/css2?family=Kodchasan:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/anime@3.2.1/lib/anime.min.js"></script>

  <style>
    :root {
      --color-bg: #F2F7F3;
      --color-accent: #FF7A45;
      --color-success: #2F9E8F;
      --color-warning: #FFC857;
      --color-text: #333;
      --color-text-light: #666;
      --color-border: #ddd;
      --color-rod: #FF7A45;
      --color-rod-alt: #FF6B2A;
      --color-bead-a: #FF7A45;
      --color-bead-b: #2F9E8F;
      --font-heading: 'Kodchasan', sans-serif;
      --font-body: 'Noto Sans Thai', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #1a1a1a;
        --color-text: #f0f0f0;
        --color-text-light: #ccc;
        --color-border: #444;
      }
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
      line-height: 1.6;
    }

    body {
      min-height: 100vh;
      padding: 16px;
    }

    h1, h2, h3 {
      font-family: var(--font-heading);
      font-weight: 600;
    }

    h1 {
      font-size: 28px;
      margin: 0 0 8px 0;
      color: var(--color-accent);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .section {
      display: none;
      animation: fadeIn 0.3s ease-in;
    }

    .section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    button {
      min-width: 48px;
      min-height: 48px;
      padding: 12px 20px;
      font-size: 16px;
      font-family: var(--font-body);
      border: 2px solid var(--color-accent);
      background-color: var(--color-accent);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background-color: #ff6b2a;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.secondary {
      background-color: transparent;
      color: var(--color-accent);
      border-color: var(--color-accent);
    }

    button.secondary:hover {
      background-color: rgba(255, 122, 69, 0.1);
    }

    input[type="text"],
    input[type="number"] {
      min-height: 48px;
      padding: 12px;
      font-size: 16px;
      font-family: var(--font-body);
      border: 2px solid var(--color-border);
      border-radius: 8px;
      background-color: var(--color-bg);
      color: var(--color-text);
    }

    .card {
      background-color: rgba(255, 122, 69, 0.05);
      border: 2px solid rgba(255, 122, 69, 0.2);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .question {
      background-color: rgba(47, 158, 143, 0.05);
      border-left: 4px solid var(--color-success);
      padding: 16px;
      margin: 16px 0;
      border-radius: 4px;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin: 12px 0;
    }

    .option-button {
      text-align: left;
      background-color: transparent;
      color: var(--color-text);
      border: 2px solid var(--color-border);
      padding: 12px 16px;
      font-size: 14px;
    }

    .option-button:hover {
      border-color: var(--color-accent);
      background-color: rgba(255, 122, 69, 0.1);
    }

    .option-button.selected {
      background-color: var(--color-accent);
      color: white;
      border-color: var(--color-accent);
    }

    canvas {
      border: 1px solid var(--color-border);
      border-radius: 4px;
      display: block;
      margin: 12px 0;
      background-color: rgba(255, 255, 255, 0.05);
      max-width: 100%;
      height: auto;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: 12px auto;
    }

    .text-input-group {
      display: flex;
      gap: 8px;
      margin: 12px 0;
    }

    .text-input-group input {
      flex: 1;
    }

    .hint {
      font-size: 14px;
      color: var(--color-text-light);
      margin-top: 8px;
      font-style: italic;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    .status-message {
      padding: 12px 16px;
      border-radius: 8px;
      margin: 12px 0;
      font-weight: 500;
    }

    .status-message.good {
      background-color: rgba(47, 158, 143, 0.2);
      color: var(--color-success);
    }

    .status-message.info {
      background-color: rgba(255, 198, 87, 0.2);
      color: #cc9900;
    }

    .intro-text {
      font-size: 16px;
      line-height: 1.8;
      margin: 16px 0;
    }

    .button-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 12px 0;
    }

    .button-group button {
      flex: 1;
      min-width: 80px;
    }

    .practice-item {
      background: rgba(255, 122, 69, 0.05);
      border: 1px solid rgba(255, 122, 69, 0.2);
      border-radius: 8px;
      padding: 12px;
      margin: 8px 0;
    }

    .practice-item h4 {
      margin: 0 0 8px 0;
      font-size: 18px;
    }

    .practice-item .feedback {
      margin-top: 8px;
      font-weight: 500;
    }

    .set-navigation {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 16px 0;
      flex-wrap: wrap;
    }

    .set-nav-btn {
      min-width: 60px;
      padding: 8px 12px;
      font-size: 14px;
    }

    .set-nav-btn.active {
      background-color: var(--color-accent);
      color: white;
    }

    .page-navigation {
      margin-top: 32px;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .practice-question {
      background-color: rgba(255, 122, 69, 0.08);
      border: 2px solid rgba(255, 122, 69, 0.2);
      border-radius: 8px;
      padding: 12px;
      margin: 8px 0;

    }

      min-width: 80px;

      padding: 8px 16px;
      font-size: 14px;
      min-width: auto;
    }

</head>

    function showSection(index) {
      document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
      if (index >= 0 && index < SECTIONS.length) {
        document.getElementById(`${SECTIONS[index]}-section`).classList.add('active');
        APP_STATE.currentSection = index;
        updateNavButtons();
        if (index === 1) {
          renderPracticeSet(APP_STATE.currentSet);
        }
      }

    function updateNavButtons() {
      document.getElementById('prev-btn').disabled = APP_STATE.currentSection === 0;
      document.getElementById('next-btn').disabled = APP_STATE.currentSection === SECTIONS.length - 1;

    function saveToLocalStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(APP_STATE.sessionData));
      } catch (e) {
        console.error('Failed to save to localStorage:', e);
      }
    }

    function loadFromLocalStorage() {
      try {
        const item = localStorage.getItem(STORAGE_KEY);
        return item ? JSON.parse(item) : null;
      } catch (e) {
        console.error('Failed to load from localStorage:', e);
        return null;
      }
    }

    function recordAnswer(itemType, itemId, a, b, userAnswer, isCorrect, regroup) {
      const silentTimeStart = sessionStorage.getItem(`q-${itemId}-start`);
      const silentTime = silentTimeStart ? Math.round((Date.now() - parseInt(silentTimeStart)) / 1000) : 0;

      const record = {
        itemId: itemId,
        type: itemType,
        a: a,
        b: b,
        answer: a + b,
        userAnswer: userAnswer,
        isCorrect: isCorrect,
        mistakeCode: isCorrect ? '-' : determineMistakeCode(a, b, userAnswer, regroup),
        silentTime: silentTime,
        attempts: 1
      };

      APP_STATE.sessionData.items.push(record);
      saveToLocalStorage();
    }

    function determineMistakeCode(a, b, userAnswer, regroup) {
      const correct = a + b;
      const diff = correct - userAnswer;

      if (userAnswer === correct) return '-';
      if (diff === 1 || diff === -1) return 'M5';
      if (!regroup && diff === -10) return 'M9';
      if (regroup && diff === 10) return 'M10';
      if (regroup && diff === -10) return 'M15';
      if (userAnswer.toString().includes(String(correct))) return 'M11';

      const tensA = Math.floor(a / 10);
      const tensB = Math.floor(b / 10);
      if (userAnswer === (tensA + tensB)) return 'M9';

      return 'MX';
    }

    function drawRodsAndBeads(canvasId, tens, ones, animate = false) {

      if (!canvas) return;

      const dpr = window.devicePixelRatio || 1;

      canvas.width = 400 * dpr;
      canvas.height = 250 * dpr;
      ctx.scale(dpr, dpr);

      const bgColor = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        ? '#1a1a1a'
        : '#F2F7F3';
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, 400, 250);

      const rodColor = '#FF7A45';
      const beadColor = '#FF7A45';
      const padding = 20;
      const rodWidth = 12;
      const rodHeight = 120;
      const spacingH = 22;

      // Draw rods (tens)
      let x = padding;
      for (let i = 0; i < tens; i++) {
        ctx.fillStyle = rodColor;
        ctx.fillRect(x, 40, rodWidth, rodHeight);

        // Divider line
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x, 100);
        ctx.lineTo(x + rodWidth, 100);
        ctx.stroke();

        x += rodWidth + spacingH;
      }

      // Draw beads (ones)
      x = padding;
      for (let i = 0; i < ones; i++) {
        ctx.fillStyle = beadColor;
        ctx.beginPath();
        ctx.arc(x + 8, 180 + (i % 2) * 20, 6, 0, Math.PI * 2);
        ctx.fill();

        if ((i + 1) % 2 === 0) {
          x += spacingH;
        }
      }

      // Label
      ctx.fillStyle = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        ? '#f0f0f0'
        : '#333';
      ctx.font = '13px "Noto Sans Thai"';
      ctx.fillText(`${tens} แท่ง ${ones} เม็ด = ${tens * 10 + ones}`, 20, 25);

      // Animate if needed
      if (animate && typeof anime !== 'undefined') {
        anime({
          targets: canvas,
          opacity: [0, 1],
          duration: 500,
          easing: 'easeInOutQuad'
        });
      }
    }

    // ============================================
    // Precheck Section
    // ============================================
    function initPrecheck() {
      const container = document.getElementById('precheck-content');
      container.innerHTML = '';

      let selectedAnswers = {};

      PRECHECK_QUESTIONS.forEach((q, idx) => {
        const div = document.createElement('div');
        div.className = 'question';
        div.innerHTML = `<h4>${q.text}</h4>`;

        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options';

        // Shuffle options
        const shuffled = [...q.options].sort(() => Math.random() - 0.5);

        shuffled.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'option-button';
          btn.textContent = opt.text;
          btn.onclick = () => {
            selectedAnswers[q.id] = opt;
            document.querySelectorAll(`#precheck-content .question`)[idx]
              .querySelectorAll('.option-button')
              .forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');

            recordAnswer('precheck', q.id, null, null, opt.value, !!opt.correct, false);
          };
          optionsDiv.appendChild(btn);
        });

        div.appendChild(optionsDiv);
        container.appendChild(div);
      });

      const continueBtn = document.createElement('button');
      continueBtn.textContent = 'เรียนตามปกติ';
      continueBtn.onclick = () => showSection(1);
      container.appendChild(continueBtn);
    }

    // ============================================
    // Practice Section
    // ============================================
    function initPracticeNav() {
      const nav = document.getElementById('set-nav');
      nav.innerHTML = '';

      for (let i = 0; i < 9; i++) {
        const btn = document.createElement('button');
        btn.className = `set-nav-btn ${i === 0 ? 'active' : ''}`;
        btn.textContent = `ชุด ${i + 1}`;
        btn.onclick = () => {
          APP_STATE.currentSet = i;
          document.querySelectorAll('.set-nav-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderPracticeSet(i);
        };
        nav.appendChild(btn);
      }
    }

    function renderPracticeSet(setIndex) {
      const startIdx = setIndex * 10;
      const endIdx = startIdx + 10;
      const items = PRACTICE_ITEMS.slice(startIdx, endIdx);

      const container = document.getElementById('practice-content');
      container.innerHTML = `<h3>ชุดที่ ${setIndex + 1}</h3>`;

      items.forEach((item, idx) => {
        const itemNum = startIdx + idx + 1;
        const itemId = `PR1-${String(itemNum).padStart(2, '0')}`;

        const div = document.createElement('div');
        div.className = 'practice-question';
        div.innerHTML = `
          <h4>ข้อที่ ${itemNum}: ${item.a} + ${item.b} = ?</h4>
          <div class="canvas-container">
            <canvas id="canvas-${itemId}" width="400" height="200"></canvas>
          </div>
          <div class="practice-controls">
            <input type="number" id="answer-${itemId}" placeholder="ตอบ" min="0" max="999" aria-label="กรุณาใส่คำตอบ">
            <button id="check-${itemId}">เช็ค</button>
          </div>
          <div id="feedback-${itemId}" class="feedback"></div>
        `;
        container.appendChild(div);

        // Draw canvas
        setTimeout(() => {
          const tens1 = Math.floor(item.a / 10);
          const ones1 = item.a % 10;
          drawRodsAndBeads(`canvas-${itemId}`, tens1, ones1, false);
        }, 0);

        // Set up interaction
        const input = document.getElementById(`answer-${itemId}`);
        const checkBtn = document.getElementById(`check-${itemId}`);
        const feedback = document.getElementById(`feedback-${itemId}`);

        // Track question start time
        input.onfocus = () => {
          if (!sessionStorage.getItem(`q-${itemId}-start`)) {
            sessionStorage.setItem(`q-${itemId}-start`, Date.now().toString());
          }
        };

        checkBtn.onclick = () => {
          const answer = parseInt(input.value, 10);
          if (isNaN(answer)) {
            feedback.textContent = 'กรุณาใส่ตัวเลข';
            feedback.className = 'feedback status-message info';
            return;
          }

          if (answer === item.answer) {
            feedback.textContent = '✓ ถูก!';
            feedback.className = 'feedback status-message good';
            recordAnswer('practice', itemId, item.a, item.b, answer, true, item.regroup);
            input.disabled = true;
            checkBtn.disabled = true;
          } else {
            feedback.textContent = `✗ ตอบ ${answer} ไม่ถูกนะ ลองอีกครั้ง`;
            feedback.className = 'feedback status-message info';
            recordAnswer('practice', itemId, item.a, item.b, answer, false, item.regroup);
          }
        };

        input.onkeypress = (e) => {
          if (e.key === 'Enter') {
            checkBtn.click();
          }
        };
      });
    }

    // ============================================
    // Export Results
    // ============================================
    document.getElementById('export-btn').onclick = () => {
      const data = loadFromLocalStorage() || APP_STATE.sessionData;
      const exportData = {
        lessonId: LESSON_ID,
        lessonVersion: LESSON_VERSION,
        exportedAt: new Date().toISOString(),
        items: data.items || []
      };

      const json = JSON.stringify(exportData, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ADD-05-results-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    };

    // ============================================
    // Navigation
    // ============================================
    document.getElementById('prev-btn').onclick = () => showSection(APP_STATE.currentSection - 1);
    document.getElementById('next-btn').onclick = () => showSection(APP_STATE.currentSection + 1);

    // ============================================
    // Initialize
    // ============================================
    function init() {
      initPrecheck();
      initPracticeNav();
      showSection(0);

      // Check if we should show export button (for parent view)
      if (window.location.search.includes('admin')) {
        document.getElementById('export-btn').style.display = 'block';
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
